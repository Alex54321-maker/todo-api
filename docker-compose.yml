version: '3.8'

services:
  # 1. База данных PostgreSQL для задач
  db:
    image: postgres:16
    container_name: micro_postgres_db
    restart: always
    environment:
      - POSTGRES_USER=alex_user
      - POSTGRES_PASSWORD=alex_secure_password
      - POSTGRES_DB=micro_todo_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alex_user -d micro_todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - micro_network

  # Новая изолированная база данных для соцсети и лайков
  social_db:
    image: postgres:16
    container_name: micro_social_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: micro_social_db
    ports:
      - "5433:5432"
    volumes:
      - social_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d micro_social_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:          
      - micro_network

  # Брокер сообщений RabbitMQ (Инфраструктура)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_broker
    restart: always
    ports:
      - "5672:5672"   # Порт для обмена сообщениями AMQP
      - "15672:15672" # Порт для веб-панели управления (Management UI)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - micro_network

  # 2. Микросервис Авторизации (Auth-Service)
  auth_service:
    build: ./auth_service
    container_name: auth_microservice
    restart: always
    environment:
      - DATABASE_URL=postgresql://alex_user:alex_secure_password@db:5432/micro_todo_db
      - JWT_SECRET=super_secret_key_123
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - micro_network

  # 3. Микросервис Задач (Task-Service)
  task_service:
    build: ./task_service
    container_name: task_microservice
    restart: always
    environment:
      - DATABASE_URL=postgresql://alex_user:alex_secure_password@db:5432/micro_todo_db
      - JWT_SECRET=super_secret_key_123
      - PYTHONUNBUFFERED=1
    command: bash -c "sleep 25 && uvicorn main:app --host 0.0.0.0 --port 8001"
    depends_on:
      - db
      - rabbitmq
    networks:
      - micro_network

  # 4. Микросервис Подписок и Лайков (Social-Service)
  social_service:
    build: ./social_service
    container_name: social_microservice
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@social_db:5432/micro_social_db
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 8003
    volumes:
      - ./frontend/index.html:/home/user/todo-api/monolith_v2/static/index.html
    depends_on:
      social_db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - micro_network

  # 5. Фоновый процесс для обработки очередей соцсети
  social_worker:
    build: ./social_service
    container_name: social_worker_service
    restart: always
    command: python worker.py
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - micro_network

  # 6. Шлюз Маршрутизации (Gateway Nginx)
  gateway:
    image: nginx:alpine
    container_name: nginx_gateway
    restart: always
    ports:
      - "8000:80" 
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth_service
      - task_service
      - social_service 
    networks:
      - micro_network

# Глобальные тома вынесены строго в корень (без отступов слева)
volumes:
  rabbitmq_data:
  social_postgres_data: 

# Глобальные сети
networks:
  micro_network:
    driver: bridge
