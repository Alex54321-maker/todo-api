<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Микросервисный Менеджер Задач</title>
    <!-- Локальные стили, которые точно не заблокирует Google IDX -->
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px 10px; }
        .wrapper { max-width: 640px; width: 100%; }
        h1 { text-align: center; color: #38bdf8; font-size: 32px; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; }
        .container { background-color: #1e293b; padding: 24px; border: 1px solid #334155; border-radius: 12px; }
        h2 { color: #34d399; font-size: 20px; margin-top: 0; }
        .card { display: flex; justify-content: space-between; align-items: center; background-color: rgba(51, 65, 85, 0.5); padding: 16px; border-radius: 8px; border: 1px solid #475569; margin-bottom: 15px; }
        h3 { margin: 0 0 5px 0; font-size: 18px; }
        .card p { margin: 0; color: #94a3b8; font-size: 14px; }
        .like-btn { display: flex; align-items: center; gap: 8px; background-color: #db2777; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        .like-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1>Project IDX: Мост возведен!</h1>
        <p class="subtitle">Управление задачами и счетчик лайков в реальном времени</p>

        <div class="container">
            <h2>📋 Активные задачи</h2>
            
            <div id="tasks-container">
                <p style="color: #64748b; text-align: center; padding: 20px;">Загрузка списка задач...</p>
            </div>
        </div>
    </div>

    <script>
    
        // НАСТОЯЩИЙ И ПРАВИЛЬНЫЙ АДРЕС ТВОЕГО ШЛЮЗА:
        const API_URL = "https://8000-firebase-todo-api-1780255878457.cluster-64pjnskmlbaxowh5lzq6i7v4ra.cloudworkstations.dev";

        console.log("📡 Фронтенд успешно настроен на шлюз Nginx:", API_URL);


        // Заглушка на случай, если в базе данных Python пока нет задач
        const mockTasks = [
            { id: 1, title: "Исправить сетевую изоляцию Docker", description: "Перевести localhost на rabbitmq", likes: 42 },
            { id: 2, title: "Вывести лайки на фронтенд", description: "Написать fetch запросы на JS", likes: 105 }
        ];

        // 1. Получение списка задач с бэкенда (ЧИСТО И С API_URL)
        async function fetchTasks() {
            try {
                const response = await fetch(`${API_URL}/api/tasks`, { 
                    credentials: 'include' 
                });
                if (!response.ok) throw new Error('Бэкенд вернул ошибку');
                const tasks = await response.json();
                renderTasks(tasks);
            } catch (error) {
                console.warn("Реальный бэкенд пока пустой или недоступен, показываем тестовые данные:", error);
                renderTasks(mockTasks);
            }
        }

        // 2. Отрисовка карточек задач на экране
        function renderTasks(tasks) {
            const container = document.getElementById('tasks-container');
            container.innerHTML = '';

            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <h3>${task.title}</h3>
                        <p>${task.description || ''}</p>
                    </div>
                    <button onclick="sendLike(${task.id})" class="like-btn">
                        ❤️ <span id="like-count-${task.id}">${task.likes || 0}</span>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // 3. Отправка лайка (ИССПРАВЛЕНО: ТОЧНЫЙ ПУТЬ ДЛЯ ШЛЮЗА БЕЗ ЛИШНИХ ЗАПЯТЫХ)
        async function sendLike(taskId) {
            const countSpan = document.getElementById(`like-count-${taskId}`);
            if (countSpan) {
                countSpan.innerText = parseInt(countSpan.innerText) + 1;
            }

            try {
                const response = await fetch(`${API_URL}/api/likes/toggle?user_id=1&task_id=${taskId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include'
                });
                if (!response.ok) throw new Error('Ошибка при сохранении лайка на сервере');
                console.log(`Лайк для задачи ${taskId} успешно отправлен в PostgreSQL!`);
            } catch (error) {
                console.error("Не удалось отправить лайк на бэкенд:", error);
            }
        }

        // Автоматический запуск при загрузке страницы
        fetchTasks();
    </script>

</body>
</html>
