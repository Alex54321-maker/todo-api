server {
    listen 80;
    server_name localhost;

    # 🔥 ТЕПЕРЬ ТУТ ГЛАВНАЯ СТРАНИЦА: Запросы к корню отдают наш фронтенд из контейнера соцсети
    location / {
        proxy_pass http://social_service:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1. Авторизация и пользователи
    location /auth {
        proxy_pass http://auth_service:8000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. Менеджер задач (Задачи / TODO)
    location /api/tasks {
        proxy_pass http://task_service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Социальный сервис (Подписок)
    location /api/subscriptions {
        proxy_pass http://social_service:8003/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Социальный сервис (Лайки)
    location /api/likes {
        proxy_pass http://social_service:8003/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page   500 502 503 504  /custom_50x.html;
    location = /custom_50x.html {
        root   /usr/share/nginx/html;
    }
}
